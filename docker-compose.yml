version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: asset_copilot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: asset_copilot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asset_copilot"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
